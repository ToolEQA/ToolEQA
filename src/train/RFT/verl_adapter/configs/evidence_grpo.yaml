hydra:
  searchpath:
    - file://${oc.env:TOOLEQA_ROOT}/third_party/verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ["${oc.env:TOOLEQA_ROOT}/src/train/RFT/data/train_reward_eligible.jsonl"]
  val_files: ["${oc.env:TOOLEQA_ROOT}/src/train/RFT/data/validation_reward_eligible.jsonl"]
  prompt_key: prompt
  max_prompt_length: 12288
  # Each turn generates one complete Thought-Code action. Only generated
  # tokens consume this episode budget; Observations are persistent prompt
  # context and are capped by max_prompt_length.
  max_response_length: 3072
  train_batch_size: 1
  val_batch_size: 1
  val_max_samples: -1
  validation_shuffle: false
  return_raw_chat: true
  return_multi_modal_inputs: false
  filter_overlong_prompts: false
  truncation: error
  shuffle: true

rollout:
  nnodes: 1
  n_gpus_per_node: 1

actor_rollout_ref:
  hybrid_engine: false
  model:
    path: /mynvme0/models/Qwen/Qwen3-VL-8B-Instruct
    trust_remote_code: true
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp
    # This is measured in prompts; the one-step trainer multiplies it by
    # rollout.n before dispatching trajectories to the actor.
    ppo_mini_batch_size: 1
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: true
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    entropy_coeff: 0.0
    optim:
      lr: 1.0e-6
    fsdp_config:
      model_dtype: bf16
      # Keep actor shards resident on the two dedicated training GPUs. Manual
      # FSDP parameter offload corrupts repeated full-state snapshots in this
      # disaggregated Gloo setup; optimizer states are still offloaded and only
      # loaded after backward.
      param_offload: false
      optimizer_offload: true
  ref:
    strategy: fsdp
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      model_dtype: bf16
      param_offload: true
  rollout:
    name: vllm
    mode: async
    free_cache_engine: false
    calculate_log_probs: true
    layered_summon: true
    checkpoint_engine:
      backend: nccl
      update_weights_bucket_megabytes: 1536
    temperature: 0.8
    # The actor recomputes log-probabilities after temperature scaling, but
    # does not reproduce vLLM's top-p truncation/renormalization.  Keeping
    # top_p at 1 makes processed_logprobs describe the same distribution on
    # both sides; exploration still comes from temperature sampling.
    top_p: 1.0
    prompt_length: 12288
    response_length: 3072
    max_model_len: 16384
    max_num_seqs: 4
    gpu_memory_utilization: 0.72
    tensor_model_parallel_size: 1
    log_prob_micro_batch_size_per_gpu: 1
    # Six trajectories keep GRPO groups divisible across the three FSDP data
    # parallel ranks used by the 8B full-parameter optimizer.
    n: 6
    engine_kwargs:
      vllm:
        mm_processor_cache_gb: 0
    multi_turn:
      enable: true
      max_user_turns: 100
      max_assistant_turns: 100
      tool_config_path: null
      format: hermes
    agent:
      num_workers: 1
      default_agent_loop: tooleqa_evidence_agent
      agent_loop_config_path: ${oc.env:TOOLEQA_ROOT}/src/train/RFT/verl_adapter/configs/agent_loop.yaml

critic:
  enable: false

reward:
  num_workers: 4
  custom_reward_function:
    path: ${oc.env:TOOLEQA_ROOT}/src/train/RFT/reward_fn.py
    name: compute_score
    reward_kwargs:
      reward_phase: joint
      answer_correct: 1.0
      answer_wrong: -1.0
      # Must be lower than the worst unsupported wrong-final score (-1.8), so
      # omitting final_answer is never the safer policy.
      answer_missing: -2.0
      evidence_terminal: 2.0
      premature_final: -0.5
      unsupported_final: -0.3
      invalid_action: -0.2
      duplicate_action: -0.1
      no_progress: -0.05
      tool_cost: -0.01
      path_excess: -0.2
      path_excess_cap: 2.0
      position_tolerance: 2.0

algorithm:
  # GDPO normalizes evidence and gated-answer rewards independently. Constant
  # zero-evidence groups therefore receive zero advantage instead of learning
  # from answer guesses or cheap termination.
  adv_estimator: gdpo
  norm_adv_by_std_in_grpo: true
  gdpo_reward_keys: [evidence_objective, answer_objective]
  gdpo_reward_weights: [1.0, 1.0]
  use_kl_in_reward: false
  rollout_correction:
    # Decoupled mode recomputes the proximal policy with the actor instead of
    # treating inference-engine probabilities as PPO's old policy.  Token-TIS
    # then corrects any residual actor/vLLM numerical mismatch without letting
    # a few extreme ratios dominate the update.
    bypass_mode: false
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: true
    rollout_rs: null
    rollout_rs_threshold: null
  kl_ctrl:
    type: fixed
    kl_coef: 0.0

trainer:
  use_legacy_worker_impl: disable
  project_name: tooleqa-evidence-rft
  experiment_name: evidence-grpo-qwen3-vl-8b-instruct-thought-code
  total_epochs: 1
  val_before_train: false
  val_only: false
  logger: ["console", "tensorboard"]
  log_val_generations: 5
  n_gpus_per_node: 3
  nnodes: 1
  save_freq: 50
  test_freq: 10
  max_actor_ckpt_to_keep: 1
  rollout_data_dir: ${oc.env:TOOLEQA_ROOT}/outputs/rft/rollouts
  validation_data_dir: ${oc.env:TOOLEQA_ROOT}/outputs/rft/validation
  default_local_dir: ${oc.env:TOOLEQA_ROOT}/outputs/rft/checkpoints
