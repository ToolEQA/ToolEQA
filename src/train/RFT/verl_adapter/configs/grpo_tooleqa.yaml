hydra:
  searchpath:
    - file:///home/zml/algorithm/ToolEQA/third_party/verl/verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ["src/train/RFT/verl_adapter/data/tooleqa_train.jsonl"]
  val_files: ["src/train/RFT/verl_adapter/data/tooleqa_train.jsonl"]
  prompt_key: prompt
  max_prompt_length: 2048
  max_response_length: 256
  train_batch_size: 4
  val_batch_size: 4
  return_raw_chat: true
  shuffle: false

rollout:
  nnodes: 1
  n_gpus_per_node: 1

actor_rollout_ref:
  hybrid_engine: false
  model:
    path: /mynvme0/models/Qwen/Qwen2.5-VL-7B-Instruct
    trust_remote_code: true
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 4
    use_dynamic_bsz: false
    use_kl_loss: false
    kl_loss_coef: 0.0
    kl_loss_type: low_var_kl
    entropy_coeff: 0.0
    fsdp_config:
      model_dtype: bf16
      param_offload: true
      optimizer_offload: true
      fsdp_size: 2
  ref:
    strategy: fsdp
    log_prob_micro_batch_size_per_gpu: 4
    fsdp_config:
      model_dtype: bf16
      param_offload: true
      fsdp_size: 2
  rollout:
    name: vllm
    mode: async
    free_cache_engine: false
    calculate_log_probs: true
    checkpoint_engine:
      backend: nccl
    tensor_model_parallel_size: 1
    data_parallel_size: 1
    enforce_eager: true
    temperature: 0.7
    top_p: 0.95
    prompt_length: 2048
    response_length: 256
    max_model_len: 2304
    log_prob_micro_batch_size_per_gpu: 4
    n: 2
    engine_kwargs:
      vllm:
        mm_processor_cache_gb: 0
    multi_turn:
      enable: true
      max_user_turns: 1
      max_assistant_turns: 8
      tool_config_path: /home/zml/algorithm/ToolEQA/src/train/RFT/verl_adapter/configs/tools_tooleqa.yaml
      format: hermes
    agent:
      num_workers: 1
      default_agent_loop: tooleqa_tool_agent
      agent_loop_config_path: /home/zml/algorithm/ToolEQA/src/train/RFT/verl_adapter/configs/tooleqa_agent_loop.yaml

critic:
  enable: false

reward:
  custom_reward_function:
    path: /home/zml/algorithm/ToolEQA/src/train/RFT/verl_adapter/reward_fn.py
    name: compute_score

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  rollout_correction:
    bypass_mode: true
  kl_ctrl:
    type: fixed
    kl_coef: 0.0

trainer:
  use_legacy_worker_impl: disable
  project_name: tooleqa-verl
  experiment_name: controller-grpo
  total_epochs: 1
  val_before_train: false
  val_only: true
  logger: ["console"]
  n_gpus_per_node: 1
  nnodes: 1
  save_freq: -1
  test_freq: -1
